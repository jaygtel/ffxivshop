# nginx settings for the Aether & Allure server image. The image includes this
# file inside its http block. It serves the built site over plain HTTP on port
# 8080; Traefik sits in front and handles HTTPS.

# Trunk names build files with a content hash (name-<16 hex digits>.js, .wasm,
# .css, .svg), so they never change and can be cached for a year. Everything
# else, including index.html, is checked for changes on every visit, so updates
# show up straight away.
map $uri $cache_control {
    "~-[0-9a-f]{16}(_bg)?\.(js|wasm|css|svg)$"  "public, max-age=31536000, immutable";
    default                                      "no-cache";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;
    # Redirects use relative paths, so they stay correct behind Traefik.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/wasm
               application/json image/svg+xml text/plain;

    # `always` adds them to error pages too.
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # The site's pages besides the homepage. Each is index.html too: the site
    # shows the right page for the address. A new page needs its own lines
    # here (as well as in src/pages/mod.rs), or the server won't find it;
    # `cargo test` checks that every page has them.
    location = /shop {
        try_files /index.html =404;
    }
    # With a / on the end, the page's own links would point inside /shop/.
    location = /shop/ {
        return 301 /shop$is_args$args;
    }
}
