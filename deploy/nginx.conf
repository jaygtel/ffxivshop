# nginx settings for the Aether & Allure server image. The image includes this
# file inside its http block. It serves the built site over plain HTTP on port
# 8080; Traefik sits in front and handles HTTPS.

# Trunk names build files with a content hash (name-<16 hex digits>.js, .wasm,
# .css, .svg), so they never change and can be cached for a year. Everything
# else, including index.html, is checked for changes on every visit, so updates
# show up straight away.
map $uri $cache_control {
    "~-[0-9a-f]{16}(_bg)?\.(js|wasm|css|svg)$"  "public, max-age=31536000, immutable";
    default                                      "no-cache";
}

# The fonts can be loaded from other places, such as the order receipt the
# orders service emails, which uses them where the email program allows it.
# Browsers only load fonts across sites with this header. (nginx leaves the
# header out when the value is empty.)
map $uri $font_sharing {
    "~^/assets/fonts/"  "*";
    default             "";
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;
    server_tokens off;
    # Redirects use relative paths, so they stay correct behind Traefik.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/wasm
               application/json image/svg+xml text/plain;

    # `always` adds them to error pages too.
    add_header Cache-Control $cache_control always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Access-Control-Allow-Origin $font_sharing always;

    location / {
        try_files $uri $uri/ =404;
    }

    # The site's pages besides the homepage. Each is index.html too: the site
    # shows the right page for the address. A new page needs its own lines
    # here (as well as in src/pages/mod.rs), or the server won't find it;
    # `cargo test` checks that every page has them.
    location = /shop {
        try_files /index.html =404;
    }
    # With a / on the end, the page's own links would point inside /shop/.
    location = /shop/ {
        return 301 /shop$is_args$args;
    }
    # The contact page, in the same way.
    location = /contact {
        try_files /index.html =404;
    }
    location = /contact/ {
        return 301 /contact$is_args$args;
    }

    # The market prices the prices service writes every week, from the volume
    # the two share (compose.yaml). The site loads them when it opens, and
    # uses shop.toml's prices while this is missing (a 404).
    location = /prices.json {
        alias /srv/prices/prices.json;
    }

    # Orders sent with the order panel's Send by email go to the orders
    # service (compose.yaml), which emails them. Docker's own DNS looks its
    # container up when an order comes in, so the site starts, and answers,
    # even while the orders service is down (an order then gets a 502, and
    # the order panel says it could not be sent).
    location = /api/order {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $orders http://aether-allure-orders:8080;
        proxy_pass $orders;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        client_max_body_size 16k;
    }

    # Messages sent with the contact page's form go to the orders service
    # too, which emails them, in the same way.
    location = /api/contact {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $orders http://aether-allure-orders:8080;
        proxy_pass $orders;
        proxy_http_version 1.1;
        proxy_read_timeout 30s;
        client_max_body_size 16k;
    }
}
