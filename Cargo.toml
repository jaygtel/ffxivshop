[package]
name = "ffxiv-shop"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "An FFXIV crafting shop page, written in Rust and compiled to WebAssembly."
# The code only. The logos, artwork and branding it carries, such as the
# emblem in src/components/hero.rs, are all rights reserved: see docs/NOTICE.md.
license = "BSD-3-Clause"
authors = ["Jason Telford"]
publish = false

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
# The pages' addresses (/, /shop and /contact), and moving between them
# without reloading the site.
leptos_router = "0.8"
serde = { version = "1", features = ["derive"] }
# Reads prices.json, the market prices the server writes (src/prices.rs).
serde_json = "1"
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "CanvasGradient",
  "CanvasRenderingContext2d",
  "Document",
  "DomRect",
  "Element",
  "FocusOptions",
  "Headers",
  "History",
  "HtmlCanvasElement",
  "HtmlDocument",
  "HtmlElement",
  "HtmlTextAreaElement",
  "Location",
  "MediaQueryList",
  "Navigator",
  "RequestInit",
  "ResizeObserver",
  "Response",
  "ScrollBehavior",
  "ScrollIntoViewOptions",
  "ScrollLogicalPosition",
  "ScrollToOptions",
  "Storage",
  "Window",
] }

# build.rs checks shop.toml with the same code the site uses.
[build-dependencies]
serde = { version = "1", features = ["derive"] }
toml = { version = "1", default-features = false, features = ["std", "parse", "serde"] }

[workspace]
members = ["tools", "orders"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
