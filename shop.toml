# ─────────────────────────────────────────────────────────────────────────────
#  Your shop. Everything on the website comes from this file.
#
#  After editing, rebuild (or leave `trunk serve` running and it reloads).
#  A mistake here stops the build with a message saying what to fix.
#
#  Adding items: write the in-game name, category, price and ready time,
#  then run   cargo run -p shop-tools -- fill
#  to look up the Eorzea Database link, icon, item level and jobs for you.
# ─────────────────────────────────────────────────────────────────────────────

[site]
address = "https://aetherandallure.com"
copyright = "Jason Telford"              # owner of the site design; shown in the footer as © <since> <name>
since = 2026                             # the notice becomes "2026–2027" and so on automatically

[shop]
name = "Aether & Allure"
# The hero at the top of the page (assets/hero.svg) shows the name, title and
# tagline as part of its drawing. These lines are what screen readers hear, so
# keep them matching; changing the words on screen means redrawing the hero.
title = "Master Artisan"                 # shown as «Master Artisan» above the name
owner = "Sigrid Halvorsen"               # the character who owns the shop
owner_role = "Owned and designed by"
tagline = "Crafted gear, meals and furnishings, made to order in FINAL FANTASY XIV."

status = "open"                          # open, busy or closed
status_note = "Current wait is about a day on top of the times below."

default_ready = "1d"                     # used by any item without its own `ready`

lodestone = "eu"                         # which Lodestone the item links open: na, eu, fr, de or jp
icons = true                             # item icons, loaded from XIVAPI
tooltips = true                          # Square Enix's Eorzea Database hover tooltips

# Shows a "sample shop" notice. Set to false once your own details are in.
demo = false

how_to_order = [
  "Add what you'd like to your order, then copy it.",
  "Send it to me with a /tell or on Discord.",
  "I'll confirm the price and when it'll be ready.",
  "Collect it with a trade, or buy it from my retainer in the garden.",
]

[shop.crafters]                          # job = level; remove any you don't do
CRP = 100
BSM = 100
ARM = 100
GSM = 100
LTW = 100
WVR = 100
ALC = 100
CUL = 100

[location]
data_center = "Chaos"
world = "Sagittarius"
district = "Shirogane"                   # Mist, The Lavender Beds, The Goblet, Shirogane or Empyreum
ward = 29
plot = 3                                 # 31-60 are in the subdivision
# size = "Medium"                        # Small, Medium or Large, if you'd like it shown
retainer = "Yhuna'li"                    # your retainer's name
spot = "in the garden"

[contact]
note = "I usually reply within a few hours, most evenings and weekends (UK time)."
tell = true                              # shows "/tell Sigrid Halvorsen@Sagittarius" with a copy button
friend_request = true
message_book = true                      # visitors can leave a note in the estate's message book
# linkshell = "Garden Crafters (CWLS)"
discord = "your.discord.name"            # your Discord username
# discord_server = "https://discord.gg/your-invite"
email = "commissions@example.com"        # e.g. an address on aetherandallure.com

# [[contact.links]]
# label = "Bluesky"
# url = "https://bsky.app/profile/your-handle"

# ─── Categories ──────────────────────────────────────────────────────────────
# The tabs above the item list, in this order. `key` is what items use and
# what appears in links such as yoursite/#housing. `glyph` is the picture shown
# when an item has no icon: sword, shield, armor, ring, tool, potion, food,
# house, gem or crate.

[[category]]
key = "arms"
label = "Arms"
glyph = "sword"

[[category]]
key = "armor"
label = "Armor"
glyph = "armor"

[[category]]
key = "accessories"
label = "Accessories"
glyph = "ring"

[[category]]
key = "tools"
label = "Tools"
glyph = "tool"

[[category]]
key = "consumables"
label = "Medicine & meals"
glyph = "potion"

[[category]]
key = "housing"
label = "Housing"
glyph = "house"

# ─── Items ───────────────────────────────────────────────────────────────────
# name            the in-game name
# category        one of the keys above
# price           in gil; leave it out to show "Ask"
# price_own_mats  optional price if the buyer brings the materials
# per             optional, e.g. "each" or "stack of 99"
# ready           how long until it's ready: "now", "6h", "2d", "1d 12h", "1w"
# hq              true if you craft it in high quality
# note            optional short note
# id, lodestone, icon, ilvl, level, jobs   filled in by shop-tools

