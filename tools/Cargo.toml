[package]
name = "shop-tools"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Looks up FFXIV item IDs, Eorzea Database IDs, icons and market prices for shop.toml."
license = "BSD-3-Clause"
authors = ["Jason Telford"]
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25"
ureq = { version = "3", features = ["platform-verifier"] }
