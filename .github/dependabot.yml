# Dependabot keeps what this project pins up to date. Every Monday it opens a
# pull request for whatever has a newer release, and the Build check builds it
# before it can be merged. Merging only changes main: the server keeps running
# its release until you publish and deploy a new one (see Releases in the
# wiki).
#
# Separately, when a crate in Cargo.lock has a security alert with a fix,
# Dependabot opens a pull request for it straight away ("Dependabot security
# updates" in the repository's Advanced Security settings).
#
# Two things Dependabot can't update by itself are checked every Monday by
# .github/workflows/versions.yml instead: Trunk, wasm-opt and leptosfmt in the
# Dockerfile, and crates whose newer versions need Cargo.toml changing.

version: 2

multi-ecosystem-groups:
  # The Rust version in rust-toolchain.toml and the base images the
  # Dockerfile starts from, together in one pull request, so the Rust image
  # always moves with rust-toolchain.toml.
  rust-and-images:
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    labels: ["area: tooling"]
    assignees: ["jaygtel"]

updates:
  # The crates in Cargo.lock, for the site, shop-tools and the orders service.
  # Like `cargo update`, it takes newer versions within what Cargo.toml
  # allows, for every crate, in one pull request.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    versioning-strategy: lockfile-only
    allow:
      - dependency-type: all
    groups:
      crates:
        patterns: ["*"]
    # Waits a week after a release before offering it, which keeps out most
    # hijacked releases: they're usually found and pulled within days.
    # Security updates don't wait.
    cooldown:
      default-days: 7
    labels: ["area: tooling"]
    assignees: ["jaygtel"]

  # The channel in rust-toolchain.toml. It takes a new Rust version straight
  # away, the same as the Rust image below, so the two always match.
  - package-ecosystem: rust-toolchain
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: rust-and-images
    cooldown:
      exclude: ["*"]
    labels: ["area: tooling"]

  # The rust, nginx-unprivileged and debian images in the Dockerfile's FROM
  # lines, each pinned by digest: new versions, and new digests for the same
  # version when Debian or Alpine ship security fixes.
  - package-ecosystem: docker
    directory: /
    patterns: ["*"]
    multi-ecosystem-group: rust-and-images
    # Images are offered three days after they're pushed. The official images
    # are pushed again every time they're rebuilt, so that wait could hold the
    # newest Rust image back while rust-toolchain.toml moved on. The Rust image
    # skips the wait; nginx and Debian keep it.
    cooldown:
      default-days: 3
      exclude: ["rust"]
    # nginx's odd minor versions (1.31, 1.33 and so on) are its mainline
    # branch. The site stays on the stable branch, the even ones (1.30, 1.32
    # and so on). Add the next odd version here when nginx reaches 1.40.
    ignore:
      - dependency-name: nginx/nginx-unprivileged
        versions: ["~> 1.31.0", "~> 1.33.0", "~> 1.35.0", "~> 1.37.0", "~> 1.39.0"]
    labels: ["area: tooling"]

  # The actions in .github/workflows, pinned to commits, with their version
  # in a comment beside each.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    groups:
      actions:
        patterns: ["*"]
    cooldown:
      default-days: 7
    labels: ["area: tooling"]
    assignees: ["jaygtel"]
