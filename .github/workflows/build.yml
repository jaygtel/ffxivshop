# The build check: builds the site, the prices service and the orders service
# on GitHub for every pull request into main, the same way the server builds
# them, so a change that doesn't build can't reach main. The "Protect main" ruleset only lets a pull request merge
# once this check, "Build", has passed.
#
# It only builds. Nothing is published and nothing is deployed: the server
# still updates only when you run `docker compose up -d --build` there.

name: Build check

on:
  pull_request:
    branches: [main]

# The check only reads the code.
permissions:
  contents: read

# A newer push to the same pull request replaces a run that's still going.
concurrency:
  group: build-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    # The ruleset asks for a check with this name. If you rename it, change
    # the ruleset to match, or pull requests can't be merged.
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Get the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Builds the Dockerfile's "site" stage, as `docker compose up -d --build`
      # does on the server, and keeps nothing: the image isn't saved or pushed.
      #
      # Your real Discord name and email stay in the server's .env and never
      # come to GitHub, so this build uses stand-ins. They're only there
      # because a live shop (demo = false) won't build without both set.
      - name: Build the site
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: site
          outputs: type=cacheonly
          build-args: |
            SHOP_DISCORD=build.check
            SHOP_EMAIL=build.check@example.com

      # Builds the "prices" stage too (shop-tools and the image it runs in on
      # the server), again keeping nothing.
      - name: Build the prices service
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: prices
          outputs: type=cacheonly

      # And the "orders" stage: the service that emails the orders sent with
      # the order panel's Send by email. It needs no settings to build.
      - name: Build the orders service
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: orders
          outputs: type=cacheonly
