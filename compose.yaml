# Runs the site on your server, behind your Traefik, the prices service that
# keeps its market prices up to date, and the orders service that emails the
# orders sent with the order panel's Send by email, and the messages sent with
# the contact page's form.
#
#   docker compose up -d --build
#   cp deploy/traefik/aether-allure.yml <your Traefik dynamic config folder>/
#
# After pulling changes from GitHub, run the same `up` command again.
#
# No ports are published on the server. The site joins the existing
# traefik_proxy network, where Traefik reaches it by name through Docker's
# DNS: http://aether-allure-site:8080. It also joins this project's own
# network, where it passes orders and messages on to the orders service,
# which nothing else can reach.

name: aether-allure

services:
  site:
    build:
      context: .
      target: site
      # The shop details shop.toml reads from .env (see .env.example).
      # Compose reads .env itself and hands these to the build; they end up
      # on the page, so they aren't secrets.
      args:
        SHOP_DISCORD: ${SHOP_DISCORD:-}
        SHOP_EMAIL: ${SHOP_EMAIL:-}
    image: aether-allure-site:latest
    # The name Traefik uses to reach it (see deploy/traefik/aether-allure.yml).
    container_name: aether-allure-site
    restart: unless-stopped
    networks:
      - traefik_proxy
      # Where nginx finds the orders service (deploy/nginx.conf).
      - default
    # prices.json from the prices service, which nginx serves (read-only).
    volumes:
      - prices:/srv/prices:ro
    # nginx runs as an unprivileged user on a read-only filesystem.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Works out the market prices when it starts (so after every update), then
  # every 7 days, and writes them to prices.json for the site. Change 7 to 1
  # for daily prices. If a run fails, it tries again an hour later, and the
  # site keeps the last prices. See what it did: docker compose logs prices
  prices:
    build:
      context: .
      target: prices
    image: aether-allure-prices:latest
    container_name: aether-allure-prices
    command: ["prices", "--refresh", "--json", "/data/prices.json", "--every-days", "7", "/app/shop.toml"]
    restart: unless-stopped
    # Passes on the stop signal, so it stops straight away rather than after
    # Docker's 10 seconds.
    init: true
    # Only reaches out (to Universalis and GitHub), so it stays off
    # traefik_proxy, on this project's own network.
    volumes:
      - prices:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Emails each order sent with the order panel's Send by email through
  # Postmark, to you with a copy to the buyer, and tells the page its order
  # number. It also emails each message sent with the contact page's form to
  # you, with replies going to whoever sent it. The site's nginx passes the
  # orders and messages on to it. Its settings come from .env (see
  # .env.example); until they're set, the order panel and the contact page
  # say sending isn't ready. See what it did: docker compose logs orders
  orders:
    build:
      context: .
      target: orders
    image: aether-allure-orders:latest
    container_name: aether-allure-orders
    restart: unless-stopped
    # Passes on the stop signal, so it stops straight away.
    init: true
    environment:
      # The secret. Only this container is given it.
      POSTMARK_SERVER_TOKEN: ${POSTMARK_SERVER_TOKEN:-}
      ORDER_EMAIL_FROM: ${ORDER_EMAIL_FROM:-}
      ORDER_EMAIL_TO: ${ORDER_EMAIL_TO:-}
      ORDER_EMAIL_REPLY_TO: ${ORDER_EMAIL_REPLY_TO:-}
      POSTMARK_SMTP_PORT: ${POSTMARK_SMTP_PORT:-587}
      ORDERS_PER_HOUR: ${ORDERS_PER_HOUR:-3}
      ORDERS_PER_DAY: ${ORDERS_PER_DAY:-20}
      CONTACT_EMAIL_FROM: ${CONTACT_EMAIL_FROM:-}
      CONTACT_EMAIL_TO: ${CONTACT_EMAIL_TO:-}
      MESSAGES_PER_HOUR: ${MESSAGES_PER_HOUR:-3}
      MESSAGES_PER_DAY: ${MESSAGES_PER_DAY:-20}
    # This week's market prices (read-only), so the receipt has the prices
    # the order panel showed.
    volumes:
      - prices:/srv/prices:ro
    # Stays off traefik_proxy: only the site can reach it, on this project's
    # own network, and it only reaches out to Postmark.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  # Traefik's existing network. Compose joins it but never creates or removes it.
  traefik_proxy:
    name: traefik_proxy
    external: true
  # This project's own network (aether-allure_default), which Compose makes:
  # the site, the prices service and the orders service.
  default: {}

volumes:
  # prices.json: the prices service writes it, the site reads it.
  prices:
