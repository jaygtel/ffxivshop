<svg xmlns="http://www.w3.org/2000/svg" viewBox="-10.1 80 532.1 350" width="532" height="350" role="img" aria-labelledby="aa-title">
  <!-- Aether &amp; Allure monogram. Transparent: dark letters with a light edge on light backgrounds, light letters with a dark edge on dark ones. A page that inlines it can choose the colours with the custom properties aa-ink, aa-accent and aa-edge. -->
  <title id="aa-title">Aether &amp; Allure</title>
  <style>
    .aa-ink { fill: var(--aa-ink, #1d2134); }
    .aa-accent { fill: var(--aa-accent, #9a7426); }
    .aa-ink, .aa-accent {
      stroke: var(--aa-edge, rgba(255, 255, 255, 0.92));
      stroke-width: 10;
      stroke-linejoin: round;
      paint-order: stroke;
    }
    @media (prefers-color-scheme: dark) {
      .aa-ink { fill: var(--aa-ink, #f1e8d4); }
      .aa-accent { fill: var(--aa-accent, #dcb66a); }
      .aa-ink, .aa-accent { stroke: var(--aa-edge, rgba(12, 14, 24, 0.82)); }
    }
  </style>
