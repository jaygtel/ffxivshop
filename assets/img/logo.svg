<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-labelledby="aal-title">
  <!-- Aether &amp; Allure emblem, as on the coming-soon page: an aether crystal
       on a night-blue disc in gold rings. Transparent around the disc. Its
       outer ring is gold on dark backgrounds and deeper gold on light ones
       (following the colour scheme); a page that inlines it can choose that
       gold with the custom property aa-accent. -->
  <title id="aal-title">Aether &amp; Allure</title>
  <style>
    :root { color-scheme: light dark; }
    .aal-rim { stroke: #060a1a; stroke-opacity: .6; stroke: light-dark(#0a1433, #060a1a); stroke-opacity: light-dark(.88, .6); }
    .aal-ring-line { stroke: #d9b45a; stroke-opacity: .45; stroke: var(--aa-accent, light-dark(#8a6420, #d9b45a)); stroke-opacity: light-dark(.8, .45); }
    .aal-ring-dots { stroke: #d9b45a; stroke-opacity: .55; stroke: var(--aa-accent, light-dark(#8a6420, #d9b45a)); stroke-opacity: light-dark(.85, .55); }
    .aal-ring-gem { fill: #f0d68c; fill: var(--aa-accent, light-dark(#8a6420, #f0d68c)); }
    .aal-ring-dot { fill: #d9b45a; fill-opacity: .8; fill: var(--aa-accent, light-dark(#8a6420, #d9b45a)); }
  </style>
  <defs><radialGradient id="aal-disc" cx=".5" cy=".45" r=".743"><stop offset="0" stop-color="#10204a"/><stop offset=".55" stop-color="#0a1433"/><stop offset="1" stop-color="#060c22"/></radialGradient><radialGradient id="aal-halo"><stop offset="0" stop-color="#7fd8ff" stop-opacity=".38"/><stop offset=".42" stop-color="#2a7fd4" stop-opacity=".16"/><stop offset=".72" stop-color="#2a7fd4" stop-opacity=".05"/><stop offset=".92" stop-color="#2a7fd4" stop-opacity="0"/></radialGradient><radialGradient id="aal-shadow"><stop offset=".72" stop-color="#000" stop-opacity=".5"/><stop offset=".86" stop-color="#000" stop-opacity=".16"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient><linearGradient id="aal-ftl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f2fbff"/><stop offset="1" stop-color="#8fd4ff"/></linearGradient><linearGradient id="aal-ftr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#c2eaff"/><stop offset="1" stop-color="#3e94e2"/></linearGradient><linearGradient id="aal-fbl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#63b8f2"/><stop offset="1" stop-color="#1c4fa0"/></linearGradient><linearGradient id="aal-fbr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f84d4"/><stop offset="1" stop-color="#0f2a69"/></linearGradient><filter id="aal-crystal-glow" x="-100%" y="-70%" width="300%" height="240%" color-interpolation-filters="sRGB"><feGaussianBlur in="SourceAlpha" stdDeviation="7.8" result="near"/><feFlood flood-color="#7fd8ff" flood-opacity=".75"/><feComposite in2="near" operator="in" result="nearGlow"/><feGaussianBlur in="SourceAlpha" stdDeviation="24.9" result="far"/><feFlood flood-color="#2a7fd4" flood-opacity=".55"/><feComposite in2="far" operator="in" result="farGlow"/><feMerge><feMergeNode in="farGlow"/><feMergeNode in="nearGlow"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
  <g transform="translate(0 0) scale(1)"><circle class="aal-rim" cx="100" cy="100" r="92.3" fill="none" stroke-width="2.8"/><circle cx="100" cy="100" r="90" fill="url(#aal-disc)"/><circle cx="100" cy="100" r="90.45" fill="none" stroke="#d9b45a" stroke-opacity=".38" stroke-width=".93"/><circle cx="100" cy="100" r="82" fill="url(#aal-halo)"/><g><circle class="aal-ring-line" cx="100" cy="100" r="97" fill="none" stroke-width=".8"/><circle class="aal-ring-dots" cx="100" cy="100" r="90" fill="none" stroke-width=".7" stroke-dasharray="1.2 5.8"/><path class="aal-ring-gem" d="M100 0l4 4-4 4-4-4zM200 100l-4 4-4-4 4-4zM100 200l-4-4 4-4 4 4zM0 100l4-4 4 4-4 4z"/><path class="aal-ring-dot" d="M170 31.4a1.4 1.4 0 1 1-2.8 0 1.4 1.4 0 1 1 2.8 0zM170 168.6a1.4 1.4 0 1 1-2.8 0 1.4 1.4 0 1 1 2.8 0zM32.8 168.6a1.4 1.4 0 1 1-2.8 0 1.4 1.4 0 1 1 2.8 0zM32.8 31.4a1.4 1.4 0 1 1-2.8 0 1.4 1.4 0 1 1 2.8 0z"/></g><g transform="translate(26 26) scale(.74)"><circle cx="100" cy="100" r="96" fill="none" stroke="#7fd8ff" stroke-opacity=".28" stroke-dasharray="26 10 3 10"/></g><g><g transform="translate(70 49) scale(.6)" filter="url(#aal-crystal-glow)"><path d="M50 2 12 68l38 16z" fill="url(#aal-ftl)"/><path d="M50 2v82l38-16z" fill="url(#aal-ftr)"/><path d="M12 68l38 16v84z" fill="url(#aal-fbl)"/><path d="M50 84l38-16-38 100z" fill="url(#aal-fbr)"/><path d="M50 2v166M12 68l38 16 38-16" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width=".8"/><path d="M50 2 12 68l38 100 38-100z" fill="none" stroke="#e6f6ff" stroke-opacity=".7" stroke-linejoin="round"/><path d="M36 30l3-7 3 7-3 7z" fill="#fff" fill-opacity=".85"/></g></g></g>
</svg>
